server:
  port: 8080

spring:
  application:
    name: feilv-server
  datasource:
    url: jdbc:mysql://${DB_HOST:42.193.151.196}:${DB_PORT:3306}/${DB_NAME:feilv}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:alenlove@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql,classpath:db/migrations/20261112_wechat_login.sql,classpath:db/migrations/20261113_wechat_config.sql,classpath:db/migrations/20261114_user_profile.sql,classpath:db/migrations/20261115_address_region.sql,classpath:db/migrations/20261115_custom_tasks.sql,classpath:db/migrations/20261115_wallet.sql,classpath:db/migrations/20261115_task_service_pricing.sql,classpath:db/migrations/20261115_phone_transfer.sql,classpath:db/migrations/20261116_buy_budget_task_tag_modes.sql,classpath:db/migrations/20261116_retire_admin_menus.sql

# 调度参数（对应功能设计文档 8.2 调度引擎 / 详细设计 3.3 计价，全部可配置化）
feilv:
  avatar-directory: ${AVATAR_DIRECTORY:./data/avatars}
  config-encryption-key: ${CONFIG_ENCRYPTION_KEY:}
  sms:
    # 仅本地联调显式开启；未接真实短信时生产保持 false，手动绑号返回业务503。
    binding-mock-enabled: ${SMS_BINDING_MOCK_ENABLED:false}
    # 仅local/development且非prod/production/docker时可生效，默认拒绝免验证。
    binding-dev-bypass-enabled: ${SMS_BINDING_DEV_BYPASS_ENABLED:false}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  dispatch:
    radius-km: 5                 # 候选推送半径
    order-grab-timeout-min: 10    # 待接单超时（分钟）
  pricing:
    base-fee-fen: 500             # 起步价5元（分）
    base-distance-m: 2000         # 起步含2公里
    per-km-fen: 150               # 超出每公里1.5元
    night-rate: 120               # 夜间(22:00-7:00)加成120%
  share:
    rider-percent: 70             # 分账：骑手70% / 平台30%（生产经持牌机构分账，本工程模拟记录）

logging:
  level:
    com.feilv: info
  # 保留数据库异常及堆栈，只对消息和堆栈内的大陆手机号遮蔽，不关闭日志类别。
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %replace(%msg%wEx){'(?<![0-9])1[3-9][0-9]{9}(?![0-9])','[PHONE_REDACTED]'}%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} : %replace(%msg%wEx){'(?<![0-9])1[3-9][0-9]{9}(?![0-9])','[PHONE_REDACTED]'}%n"
