services:
  backend:
    image: ${BACKEND_IMAGE:-feilv/backend:latest}
    restart: always
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    expose:
      - "8080"

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-feilv/admin-web:latest}
    restart: always
    depends_on:
      - backend
    ports:
      - "${ADMIN_WEB_PORT:-80}:80"
